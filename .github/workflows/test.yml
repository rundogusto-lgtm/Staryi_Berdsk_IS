name: Tests

# Тесты запускаются на каждый пуш и на каждый pull request.
# Путь нужен, чтобы CI не срабатывал на изменениях документации.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/objects.json'
      - 'package.json'
      - 'vitest.config.js'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 — нативный модуль, нужен Python и g++ для сборки,
      # если готовых бинарников под платформу нет.
      - name: Установить зависимости
        run: npm ci

      - name: Прогнать unit- и интеграционные тесты
        run: npm test

      - name: Собрать отчёт о покрытии
        run: npm run test:coverage

      - name: Сохранить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7